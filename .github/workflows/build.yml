name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get install -y g++ make

      - name: Build hash_map
        run: cd hash_map && make -f MakeFile

      - name: Build thread_pool
        run: cd thread_pool && make -f MakeFile

      - name: Build thread_downloader
        run: cd thread_downloader && make -f MakeFile

      - name: Build tictactoe
        run: cd tictactoe && make -f MakeFile
